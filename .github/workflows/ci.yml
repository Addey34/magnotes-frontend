name: Frontend CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read
    pull-requests: read

concurrency:
    group: magnotes-frontend-ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
            - run: |
                  corepack enable
                  corepack prepare pnpm@10.33.2 --activate
            - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml
            - run: pnpm install --frozen-lockfile
            - run: pnpm run format:check
            - run: pnpm run typecheck
            - run: pnpm run lint
            - run: pnpm test --runInBand
            - run: pnpm run build:firebase
              env:
                  VITE_API_URL: https://api-magnotes.adrianguichard.dev
            - run: pnpm audit --prod --audit-level=high
            - run: pnpm exec playwright install --with-deps chromium
            - run: pnpm run e2e
            - run: pnpm run e2e:touch
            - name: Upload visual failure artifacts
              if: failure()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: playwright-visual-failures
                  path: |
                      playwright-report/
                      test-results/
                  if-no-files-found: ignore
                  retention-days: 14

    secret-scan:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  fetch-depth: 0
            - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
