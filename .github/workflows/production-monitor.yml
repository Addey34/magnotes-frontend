name: Production Monitor

on:
    schedule:
        - cron: '15 4 * * *'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: magnotes-production-monitor
    cancel-in-progress: false

jobs:
    production-health:
        runs-on: ubuntu-24.04
        # Official image ships the browsers: avoids the apt mirror stalls of
        # `playwright install --with-deps`. Keep the tag equal to @playwright/test.
        container:
            image: mcr.microsoft.com/playwright:v1.62.1-noble
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              with:
                  version: 10.33.2
            - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml
            - run: pnpm install --frozen-lockfile
            - name: Check Playwright image version
              run: test "$(pnpm exec playwright --version)" = "Version 1.62.1"
            - run: pnpm run monitor:production
              env:
                  PRODUCTION_URL: https://magnotes.adrianguichard.dev
                  PRODUCTION_API_URL: https://api-magnotes.adrianguichard.dev
            - name: Upload browser failure evidence
              if: failure()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: production-browser-failures
                  path: |
                      playwright-report/
                      test-results/
                  if-no-files-found: ignore
                  retention-days: 7
            - name: Lighthouse (Playwright Chromium)
              if: always()
              run: |
                  CHROME_PATH="$(node -e "process.stdout.write(require('@playwright/test').chromium.executablePath())")" pnpm run monitor:lighthouse
            - name: Upload Lighthouse reports
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: production-lighthouse-reports
                  path: .lighthouseci/
                  if-no-files-found: ignore
                  retention-days: 7
