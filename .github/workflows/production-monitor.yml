name: Production Monitor

on:
    schedule:
        - cron: '15 4 * * *'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: magnotes-production-monitor
    cancel-in-progress: false

jobs:
    browser-health:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
            - run: |
                  corepack enable
                  corepack prepare pnpm@10.33.2 --activate
            - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec playwright install --with-deps chromium
            - run: pnpm run monitor:production
              env:
                  PRODUCTION_URL: https://magnotes.adrianguichard.dev
                  PRODUCTION_API_URL: https://api-magnotes.adrianguichard.dev
            - name: Upload browser failure evidence
              if: failure()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: production-browser-failures
                  path: |
                      playwright-report/
                      test-results/
                  if-no-files-found: ignore
                  retention-days: 14

    lighthouse:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
            - run: |
                  corepack enable
                  corepack prepare pnpm@10.33.2 --activate
            - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml
            - run: pnpm install --frozen-lockfile
            - run: pnpm run monitor:lighthouse
            - name: Upload Lighthouse reports
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: production-lighthouse-reports
                  path: .lighthouseci/
                  if-no-files-found: ignore
                  retention-days: 14
