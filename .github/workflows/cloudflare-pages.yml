name: Cloudflare Pages

on:
    pull_request:
    workflow_dispatch:
        inputs:
            production_sha:
                description: Full current main SHA approved for publication
                required: true
                type: string
    workflow_run:
        workflows: [Frontend CI]
        types: [completed]
        branches: [main]

permissions:
    contents: read

# Do not interrupt an upload. Queued runs recheck main before publishing.
concurrency:
    group: cloudflare-pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
    cancel-in-progress: false

env:
    EXPECTED_REPOSITORY: Addey34/magnotes-frontend
    PRODUCTION_BRANCH: main
    PAGES_PROJECT: magnotes
    BUILD_DIRECTORY: firebase-dist
    PRODUCTION_URL: https://magnotes.adrianguichard.dev
    WRANGLER_SEND_METRICS: 'false'

jobs:
    deployment-tools:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions: {}
        steps:
            # Reproduce deploy's empty workspace and exact tool initialization.
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
              with:
                  version: 10.33.2
                  standalone: true
            - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
              with:
                  node-version: 22
            - name: Verify tools without checkout, credentials or Cloudflare calls
              shell: bash
              run: |
                  set -euo pipefail
                  test ! -e package.json
                  test -z "${CLOUDFLARE_API_TOKEN:-}"
                  test -z "${CLOUDFLARE_ACCOUNT_ID:-}"
                  test "$(pnpm --version)" = 10.33.2
                  node -e 'if (process.versions.node.split(".")[0] !== "22") process.exit(1)'
                  version="$(pnpm --package=wrangler@4.45.0 dlx wrangler --version)"
                  printf '%s\n' "$version"
                  grep -Eq '^4\.45\.0$' <<< "$version"
                  # --help exits before authentication or publication.
                  pnpm --package=wrangler@4.45.0 dlx wrangler pages deploy --help > "$RUNNER_TEMP/wrangler-help.txt"
                  for option in project-name branch commit-hash commit-message commit-dirty; do
                    grep -q -- "--$option" "$RUNNER_TEMP/wrangler-help.txt"
                  done
                  echo 'pnpm 10.33.2 standalone / Node 22 / Wrangler 4.45.0 start without checkout or credentials; deploy options recognized.' >> "$GITHUB_STEP_SUMMARY"
            - name: Test the Cloudflare preflight predicate with fixtures only
              shell: bash
              run: |
                  set -euo pipefail
                  filter='.success == true and .result.name == $project and .result.production_branch == $branch and .result.source == null'
                  accepted='{"success":true,"result":{"name":"magnotes","production_branch":"main","source":null}}'
                  jq -e --arg project "$PAGES_PROJECT" --arg branch "$PRODUCTION_BRANCH" "$filter" <<< "$accepted" > /dev/null
                  for mutation in '.success=false' '.result=null' '.result.name="other"' '.result.production_branch="preview"' '.result.source={"type":"github"}'; do
                    rejected="$(jq "$mutation" <<< "$accepted")"
                    if jq -e --arg project "$PAGES_PROJECT" --arg branch "$PRODUCTION_BRANCH" "$filter" <<< "$rejected" > /dev/null; then
                      echo "Preflight incorrectly accepted: $mutation" >&2
                      exit 1
                    fi
                  done
                  echo 'Preflight accepts Direct Upload/main and rejects API failure, missing/wrong project, wrong branch and Git integration (fixtures only).' >> "$GITHUB_STEP_SUMMARY"

    authorize:
        if: >-
            github.repository == 'Addey34/magnotes-frontend' &&
            (github.event_name == 'pull_request' ||
            (vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' &&
            ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
            (github.event_name == 'workflow_run' && vars.CLOUDFLARE_DEPLOY_MODE == 'automatic' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_repository.full_name == 'Addey34/magnotes-frontend' &&
            github.event.workflow_run.head_branch == 'main' &&
            github.event.workflow_run.conclusion == 'success'))))
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
            actions: read
        outputs:
            sha: ${{ steps.select.outputs.sha }}
            ci_run: ${{ steps.select.outputs.ci_run }}
        steps:
            - name: Select and verify the source commit
              id: select
              env:
                  GH_TOKEN: ${{ github.token }}
                  REQUESTED_SHA: ${{ inputs.production_sha }}
              shell: bash
              run: |
                  set -euo pipefail
                  if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
                    echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
                  test "$GITHUB_REF" = "refs/heads/$PRODUCTION_BRANCH"
                  sha="$REQUESTED_SHA"
                  if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
                    jq -e --arg repo "$EXPECTED_REPOSITORY" --arg branch "$PRODUCTION_BRANCH" '
                      .action == "completed" and
                      .workflow_run.name == "Frontend CI" and
                      .workflow_run.path == ".github/workflows/ci.yml" and
                      .workflow_run.event == "push" and
                      .workflow_run.head_repository.full_name == $repo and
                      .workflow_run.head_branch == $branch and
                      .workflow_run.status == "completed" and
                      .workflow_run.conclusion == "success"' "$GITHUB_EVENT_PATH"
                    sha="$(jq -r .workflow_run.head_sha "$GITHUB_EVENT_PATH")"
                  fi
                  [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
                  if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then test "$sha" = "$GITHUB_SHA"; fi
                  head="$(gh api "repos/$EXPECTED_REPOSITORY/git/ref/heads/$PRODUCTION_BRANCH" --jq .object.sha)"
                  test "$sha" = "$head"
                  # Query the named workflow, not an arbitrary check named 'success'.
                  gh api --paginate --slurp "repos/$EXPECTED_REPOSITORY/actions/workflows/ci.yml/runs?event=push&branch=$PRODUCTION_BRANCH&head_sha=$sha&per_page=100" > "$RUNNER_TEMP/ci-runs.json"
                  run="$(jq -ce --arg sha "$sha" --arg repo "$EXPECTED_REPOSITORY" --arg branch "$PRODUCTION_BRANCH" '
                    [.[].workflow_runs[]] | sort_by(.run_number, .run_attempt) | last |
                    select(.name == "Frontend CI" and .path == ".github/workflows/ci.yml" and
                      .event == "push" and .head_branch == $branch and .head_sha == $sha and
                      .head_repository.full_name == $repo and
                      .status == "completed" and .conclusion == "success")' "$RUNNER_TEMP/ci-runs.json")"
                  ci_run="$(jq -r .id <<< "$run")"
                  if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
                    test "$ci_run" = "$(jq -r .workflow_run.id "$GITHUB_EVENT_PATH")"
                  fi
                  echo "sha=$sha" >> "$GITHUB_OUTPUT"
                  echo "ci_run=$ci_run" >> "$GITHUB_OUTPUT"
                  echo "Validated main SHA: $sha; Frontend CI run: $ci_run" >> "$GITHUB_STEP_SUMMARY"

    build:
        needs: authorize
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            VITE_API_URL: https://api-magnotes.adrianguichard.dev
            VITE_UMAMI_SRC: https://analytics-magnotes.adrianguichard.dev/script.js
            VITE_UMAMI_WEBSITE_ID: a9929205-23b7-4c23-acce-bce9bd8b8322
            SOURCE_SHA: ${{ needs.authorize.outputs.sha }}
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
              with:
                  ref: ${{ needs.authorize.outputs.sha }}
                  persist-credentials: false
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
              with:
                  version: 10.33.2
            - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml
            - run: pnpm install --frozen-lockfile
            - run: pnpm run build:firebase
            - name: Validate the static Pages payload
              shell: bash
              run: |
                  set -euo pipefail
                  node --input-type=module <<'NODE'
                  import { readFileSync, readdirSync, lstatSync, writeFileSync } from 'node:fs';
                  import { join } from 'node:path';
                  const root = process.env.BUILD_DIRECTORY;
                  const read = p => readFileSync(join(root, p), 'utf8');
                  const assert = (ok, message) => { if (!ok) throw new Error(message); };
                  for (const file of ['index.html', 'app/index.html', '_headers', '_redirects']) assert(read(file).length > 0, `Missing/empty ${file}`);
                  assert(read('index.html').includes('/app/'), 'Landing must link to app');
                  const app = read('app/index.html');
                  assert(app.includes('/app/assets/') && app.includes('id="root"'), 'Invalid React entry point');
                  assert(read('_redirects').trim() === '/app/b/* /app/ 200', 'Unexpected SPA rewrite');
                  assert(read('_headers').includes('Content-Security-Policy') && read('_headers').includes(process.env.VITE_API_URL), 'Missing production CSP/API');
                  const files = [];
                  const walk = dir => { for (const name of readdirSync(dir)) {
                    const path = join(dir, name), stat = lstatSync(path);
                    assert(!stat.isSymbolicLink(), 'Symlink in payload');
                    assert(!name.startsWith('.') && !['_worker.js', 'functions', 'node_modules', 'wrangler.toml', 'wrangler.json', 'wrangler.jsonc'].includes(name), `Unexpected deployable content: ${name}`);
                    if (stat.isDirectory()) walk(path); else files.push(path);
                  }};
                  walk(root);
                  const js = files.filter(p => p.endsWith('.js')).map(p => readFileSync(p, 'utf8')).join('\n');
                  assert(js.includes(process.env.VITE_API_URL), 'API URL missing from bundle');
                  assert(js.includes(process.env.VITE_UMAMI_SRC) && js.includes(process.env.VITE_UMAMI_WEBSITE_ID), 'App analytics configuration missing');
                  assert(read('index.html').includes(process.env.VITE_UMAMI_SRC) && read('index.html').includes(process.env.VITE_UMAMI_WEBSITE_ID), 'Landing analytics configuration missing');
                  writeFileSync(join(root, 'deployment.json'), JSON.stringify({ sha: process.env.SOURCE_SHA, run: process.env.GITHUB_RUN_ID }) + '\n');
                  console.log(`Validated ${files.length} static files for ${process.env.SOURCE_SHA}`);
                  NODE
                  echo "Static payload validated for $SOURCE_SHA (no Cloudflare credentials)." >> "$GITHUB_STEP_SUMMARY"
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
              with:
                  name: pages-${{ needs.authorize.outputs.sha }}
                  path: firebase-dist/
                  if-no-files-found: error
                  retention-days: 7

    deploy:
        if: github.event_name != 'pull_request'
        needs: [authorize, build]
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment:
            name: cloudflare-production
            url: https://magnotes.adrianguichard.dev
        permissions:
            contents: read
            actions: read
        env:
            SOURCE_SHA: ${{ needs.authorize.outputs.sha }}
            CI_RUN: ${{ needs.authorize.outputs.ci_run }}
        steps:
            # Explicit version is required in this no-checkout workspace.
            # Keep initialization identical to the deployment-tools PR job.
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
              with:
                  version: 10.33.2
                  standalone: true
            - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
              with:
                  node-version: 22
            - name: Download only this run's payload
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh run download "$GITHUB_RUN_ID" --repo "$EXPECTED_REPOSITORY" --name "pages-$SOURCE_SHA" --dir "$BUILD_DIRECTORY"
            - name: Install pinned Wrangler without Cloudflare credentials
              run: pnpm --package=wrangler@4.45.0 dlx wrangler --version
            - name: Recheck main, CI and activation immediately before upload
              env:
                  GH_TOKEN: ${{ github.token }}
                  ENABLED: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED }}
                  MODE: ${{ vars.CLOUDFLARE_DEPLOY_MODE }}
              shell: bash
              run: |
                  set -euo pipefail
                  test "$ENABLED" = true
                  test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
                  test "$GITHUB_REF" = "refs/heads/$PRODUCTION_BRANCH"
                  if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then test "$MODE" = automatic; fi
                  test "$SOURCE_SHA" = "$(gh api "repos/$EXPECTED_REPOSITORY/git/ref/heads/$PRODUCTION_BRANCH" --jq .object.sha)"
                  gh api "repos/$EXPECTED_REPOSITORY/actions/runs/$CI_RUN" | jq -e --arg sha "$SOURCE_SHA" --arg repo "$EXPECTED_REPOSITORY" --arg branch "$PRODUCTION_BRANCH" '
                    .name == "Frontend CI" and .path == ".github/workflows/ci.yml" and
                    .event == "push" and .head_branch == $branch and .head_sha == $sha and
                    .head_repository.full_name == $repo and .status == "completed" and .conclusion == "success"'
                  test "$(jq -r .sha "$BUILD_DIRECTORY/deployment.json")" = "$SOURCE_SHA"
            - name: Publish to the existing Direct Upload project
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              shell: bash
              run: |
                  set -euo pipefail
                  test -n "$CLOUDFLARE_API_TOKEN"
                  test -n "$CLOUDFLARE_ACCOUNT_ID"
                  # Read-only preflight: never create a project or change its branch/domains.
                  curl --fail --silent --show-error --max-time 30 \
                    -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                    "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT" \
                    | jq -e --arg project "$PAGES_PROJECT" --arg branch "$PRODUCTION_BRANCH" \
                      '.success == true and .result.name == $project and .result.production_branch == $branch and .result.source == null' > /dev/null
                  pnpm --package=wrangler@4.45.0 dlx wrangler pages deploy "$BUILD_DIRECTORY" \
                    --project-name "$PAGES_PROJECT" --branch "$PRODUCTION_BRANCH" \
                    --commit-hash "$SOURCE_SHA" --commit-message "GitHub Actions $GITHUB_RUN_ID" --commit-dirty=false
            - name: Verify published SHA, HTML, assets and security headers
              shell: bash
              run: |
                  set -euo pipefail
                  verified=false
                  for attempt in {1..12}; do
                    if curl --fail --silent --show-error --max-time 20 "$PRODUCTION_URL/deployment.json?run=$GITHUB_RUN_ID" | jq -e --arg sha "$SOURCE_SHA" '.sha == $sha' > /dev/null; then
                      verified=true
                      break
                    fi
                    sleep 5
                  done
                  test "$verified" = true
                  curl --fail --silent --show-error --max-time 30 "$PRODUCTION_URL/" -o "$RUNNER_TEMP/landing.html"
                  curl --fail --silent --show-error --max-time 30 -D "$RUNNER_TEMP/app.headers" "$PRODUCTION_URL/app/" -o "$RUNNER_TEMP/app.html"
                  grep -q '/app/' "$RUNNER_TEMP/landing.html"
                  grep -q 'id="root"' "$RUNNER_TEMP/app.html"
                  grep -qi 'content-security-policy:' "$RUNNER_TEMP/app.headers"
                  grep -qi 'x-content-type-options: nosniff' "$RUNNER_TEMP/app.headers"
                  asset="$(grep -oE '/app/assets/[^" ]+\.js' "$RUNNER_TEMP/app.html" | head -n 1)"
                  test -n "$asset"
                  curl --fail --silent --show-error --max-time 30 "$PRODUCTION_URL$asset" -o "$RUNNER_TEMP/asset.js"
                  grep -q 'https://api-magnotes.adrianguichard.dev' "$RUNNER_TEMP/asset.js"
            - name: Deployment report
              if: always()
              env:
                  RESULT: ${{ job.status }}
              shell: bash
              run: |
                  {
                    echo "### Cloudflare Pages: $RESULT"
                    echo "Project: $PAGES_PROJECT; branch: $PRODUCTION_BRANCH"
                    echo "Source SHA: $SOURCE_SHA"
                    echo "Frontend CI: https://github.com/$EXPECTED_REPOSITORY/actions/runs/$CI_RUN"
                    echo "Publication run: https://github.com/$EXPECTED_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
                    echo "Production: $PRODUCTION_URL"
                    echo "A failed HTTP check does not undo an upload. See docs/CLOUDFLARE_PAGES.md for rollback."
                  } >> "$GITHUB_STEP_SUMMARY"
